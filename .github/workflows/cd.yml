name: CD

# Continuous delivery. Runs when code lands on master or when a version tag is pushed.
# Detects which parts changed and only builds what's needed.
# Android changes auto-bump the version and create a GitHub Release with the APK.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    with:
      run-all: true
    permissions:
      contents: read
      pull-requests: read

  # Detect what changed so we only build what's needed
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'googleARCore/**'
            web:
              - 'prototype/web-ui/**'
            server:
              - 'server/**'
              - 'src/**'

  build-web:
    name: Build web UI bundle
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.web == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/web-ui/package-lock.json

      - name: Build
        working-directory: prototype/web-ui
        run: |
          npm ci
          npm run build

      - name: Package (run with `npm ci --omit=dev && npm start`)
        run: |
          tar -czf web-ui-build.tar.gz --exclude=.next/cache -C prototype/web-ui .next public package.json package-lock.json next.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: buildscan-web
          path: web-ui-build.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      did_bump: ${{ steps.version.outputs.did_bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-bump version
        id: version
        run: |
          GRADLE="googleARCore/samples/hello_ar_java/app/build.gradle"

          # Read current values
          CURRENT_CODE=$(grep -oP 'versionCode \K\d+' "$GRADLE")
          CURRENT_NAME=$(grep -oP "versionName '\K[^']+" "$GRADLE")

          # If this is a tag push, use the tag version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            {
              echo "version_name=$TAG_VERSION"
              echo "version_tag=v$TAG_VERSION"
              echo "did_bump=false"
            } >> "$GITHUB_OUTPUT"
            echo "Using tag version: $TAG_VERSION"
            exit 0
          fi

          # Auto-bump: increment patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
          PATCH=$((PATCH + 1))
          NEW_NAME="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((CURRENT_CODE + 1))

          # Update build.gradle
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" "$GRADLE"
          sed -i "s/versionName '$CURRENT_NAME'/versionName '$NEW_NAME'/" "$GRADLE"

          echo "Bumped version: $CURRENT_NAME ($CURRENT_CODE) -> $NEW_NAME ($NEW_CODE)"

          # Commit the version bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE"
          git commit -m "release: v$NEW_NAME (versionCode $NEW_CODE) [skip ci]"
          git tag "v$NEW_NAME"
          git push origin master --tags

          {
            echo "version_name=$NEW_NAME"
            echo "version_tag=v$NEW_NAME"
            echo "did_bump=true"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: googleARCore/samples/hello_ar_java
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Sign with the shared key, then check the built APK
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          APK=googleARCore/samples/hello_ar_java/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" sign --ks "$GITHUB_WORKSPACE/.github/android/debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias androiddebugkey --out "$RUNNER_TEMP/signed.apk" "$APK"
          mv "$RUNNER_TEMP/signed.apk" "$APK"
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > "$RUNNER_TEMP/apk_manifest.xml"
          cat "$RUNNER_TEMP/signer.txt"
          echo "--- manifest inside the APK (first lines):"; head -c 2500 "$RUNNER_TEMP/apk_manifest.xml"; echo
          { echo "### APK checks"; cat "$RUNNER_TEMP/signer.txt"; } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/android/check_apk.py apk --manifest "$RUNNER_TEMP/apk_manifest.xml" --signer "$RUNNER_TEMP/signer.txt" --apk "$APK"

      - name: Name the APK
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version_name }}"
          cp googleARCore/samples/hello_ar_java/app/build/outputs/apk/debug/*.apk "dist/BuildScan3D-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: buildscan-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-android, changes]
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: buildscan-*
          path: release-files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.version_tag }}
          name: BuildScan 3D ${{ needs.build-android.outputs.version_tag }}
          files: release-files/*
          generate_release_notes: true

  # Every push to master refreshes one pre-release called "latest" with the newest APK, so the app can be
  # installed on a phone straight from the GitHub Releases page (no PC, no Android Studio).
  publish-latest:
    name: Update the "latest" APK release
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: buildscan-apk
          path: dist

      - name: Give the APK a fixed name (a stable download link)
        run: cp dist/BuildScan3D-*.apk dist/buildscan3d-latest.apk

      - name: Move the "latest" tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (master)
          prerelease: true
          files: dist/buildscan3d-latest.apk
          body: |
            Debug APK built automatically from master, commit ${{ github.sha }}.
            Install it over the previous version. Every build is signed with the same key, so recordings and settings are kept.
