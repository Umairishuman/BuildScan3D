name: CD

# Continuous delivery. Runs when code lands on master or when a version tag is pushed.
# Detects which parts changed and only builds what's needed.
# Android changes auto-bump the version and create a GitHub Release with the APK.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    with:
      run-all: true
    permissions:
      contents: read
      pull-requests: read

  # Detect what changed so we only build what's needed
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
      web: ${{ steps.filter.outputs.web }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - 'googleARCore/**'
            web:
              - 'prototype/web-ui/**'
            server:
              - 'server/**'
              - 'src/**'

  build-web:
    name: Build web UI bundle
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.web == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/web-ui/package-lock.json

      - name: Build
        working-directory: prototype/web-ui
        run: |
          npm ci
          npm run build

      - name: Package (run with `npm ci --omit=dev && npm start`)
        run: |
          tar -czf web-ui-build.tar.gz --exclude=.next/cache -C prototype/web-ui .next public package.json package-lock.json next.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: web-ui-build
          path: web-ui-build.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    needs: [ci, changes]
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      did_bump: ${{ steps.version.outputs.did_bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-bump version
        id: version
        run: |
          GRADLE="googleARCore/samples/hello_ar_java/app/build.gradle"

          # Read current values
          CURRENT_CODE=$(grep -oP 'versionCode \K\d+' "$GRADLE")
          CURRENT_NAME=$(grep -oP "versionName '\K[^']+" "$GRADLE")

          # If this is a tag push, use the tag version
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version_name=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_tag=v$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "did_bump=false" >> "$GITHUB_OUTPUT"
            echo "Using tag version: $TAG_VERSION"
            exit 0
          fi

          # Auto-bump: increment patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
          PATCH=$((PATCH + 1))
          NEW_NAME="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((CURRENT_CODE + 1))

          # Update build.gradle
          sed -i "s/versionCode $CURRENT_CODE/versionCode $NEW_CODE/" "$GRADLE"
          sed -i "s/versionName '$CURRENT_NAME'/versionName '$NEW_NAME'/" "$GRADLE"

          echo "Bumped version: $CURRENT_NAME ($CURRENT_CODE) -> $NEW_NAME ($NEW_CODE)"

          # Commit the version bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$GRADLE"
          git commit -m "release: v$NEW_NAME (versionCode $NEW_CODE) [skip ci]"
          git tag "v$NEW_NAME"
          git push origin master --tags

          echo "version_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "version_tag=v$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "did_bump=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: googleARCore/samples/hello_ar_java
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version_name }}"
          cp googleARCore/samples/hello_ar_java/app/build/outputs/apk/debug/*.apk "dist/BuildScan3D-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [build-android, changes]
    if: ${{ needs.changes.outputs.android == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: release-files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.version_tag }}
          name: BuildScan 3D ${{ needs.build-android.outputs.version_tag }}
          files: release-files/*
          generate_release_notes: true
