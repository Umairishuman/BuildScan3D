name: CD

# Continuous delivery. Runs when code lands on master, when a version tag (v1.0.0, ...) is pushed,
# or by hand. It runs the full CI first, then builds the deliverables:
#   - web UI production bundle (artifact)
#   - Android debug APK (artifact)
#   - on a version tag: a GitHub Release with both files attached
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Deliveries run one after another, never cancelled half-way.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    with:
      run-all: true
    permissions:
      contents: read
      pull-requests: read

  build-web:
    name: Build web UI bundle
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/web-ui/package-lock.json

      - name: Build
        working-directory: prototype/web-ui
        run: |
          npm ci
          npm run build

      - name: Package (run with `npm ci --omit=dev && npm start`)
        run: |
          tar -czf web-ui-build.tar.gz --exclude=.next/cache -C prototype/web-ui .next public package.json package-lock.json next.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: web-ui-build
          path: web-ui-build.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences (the SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: googleARCore/samples/hello_ar_java
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK after the commit
        run: |
          mkdir -p dist
          cp googleARCore/samples/hello_ar_java/app/build/outputs/apk/debug/*.apk "dist/buildscan3d-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
