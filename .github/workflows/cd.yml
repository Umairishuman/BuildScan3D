name: CD

# Continuous delivery. Runs when code lands on master, when a version tag (v1.0.0, ...) is pushed,
# or by hand. It runs the full CI first, then builds the deliverables:
#   - web UI production bundle (artifact)
#   - Android debug APK (artifact)
#   - on a version tag: a GitHub Release with both files attached
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Deliveries run one after another, never cancelled half-way.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    with:
      run-all: true
    permissions:
      contents: read
      pull-requests: read

  build-web:
    name: Build web UI bundle
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/web-ui/package-lock.json

      - name: Build
        working-directory: prototype/web-ui
        run: |
          npm ci
          npm run build

      - name: Package (run with `npm ci --omit=dev && npm start`)
        run: |
          tar -czf web-ui-build.tar.gz --exclude=.next/cache -C prototype/web-ui .next public package.json package-lock.json next.config.ts

      - uses: actions/upload-artifact@v4
        with:
          name: buildscan-web
          path: web-ui-build.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android APK
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences (the SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Use the team's shared debug signing key (so every APK can be installed over the previous one)
        run: |
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/.github/android/debug.keystore" ~/.android/debug.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: googleARCore/samples/hello_ar_java
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check the built APK (package, permissions, launcher, signing key, size)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=googleARCore/samples/hello_ar_java/app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          { echo "### APK checks"; cat "$RUNNER_TEMP/signer.txt"; grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity)" "$RUNNER_TEMP/badging.txt"; } >> "$GITHUB_STEP_SUMMARY"
          python3 .github/android/check_apk.py apk --badging "$RUNNER_TEMP/badging.txt" --signer "$RUNNER_TEMP/signer.txt" --apk "$APK"

      - name: Name the APK after the commit
        run: |
          mkdir -p dist
          cp googleARCore/samples/hello_ar_java/app/build/outputs/apk/debug/*.apk "dist/buildscan3d-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: buildscan-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: buildscan-*          # only the CD deliverables, not the CI test reports or lint report
          path: release-files
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true

  # Every push to master refreshes one pre-release called "latest" with the newest APK, so the app can be
  # installed on a phone straight from the GitHub Releases page (no PC, no Android Studio).
  publish-latest:
    name: Update the "latest" APK release
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: buildscan-apk
          path: dist

      - name: Give the APK a fixed name (a stable download link)
        run: cp dist/buildscan3d-*.apk dist/buildscan3d-latest.apk

      - name: Move the "latest" tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (master)
          prerelease: true
          files: dist/buildscan3d-latest.apk
          body: |
            Debug APK built automatically from master, commit ${{ github.sha }}.
            Install it over the previous version. Every build is signed with the same key, so recordings and settings are kept.
